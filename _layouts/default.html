<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#fff8e9">
  <script src="{{ '/assets/scene-init.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/scenes.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/scenes.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="ocean-backdrop" aria-hidden="true" data-sprite-manifest="{{ '/assets/underwater/sprites.json' | relative_url }}?v={{ site.time | date: '%s' }}">
    <span class="ocean-creature ocean-moray" data-swim="moray" data-side="left"><span class="ocean-sprite" data-sprite="moray"></span></span>
    <span class="ocean-creature ocean-school" data-swim="school" data-side="right"><span class="ocean-sprite" data-sprite="school"></span></span>
    <span class="ocean-creature ocean-jellyfish" data-swim="jellyfish" data-side="left"><span class="ocean-sprite" data-sprite="jellyfish"></span></span>
    <span class="ocean-creature ocean-jellyfish ocean-jellyfish-medium" data-swim="jellyfish-medium" data-side="right" data-swim-offset="18"><span class="ocean-sprite" data-sprite="jellyfish" data-start-frame="1"></span></span>
    <span class="ocean-creature ocean-jellyfish ocean-jellyfish-small" data-swim="jellyfish-small" data-side="left" data-swim-offset="37"><span class="ocean-sprite" data-sprite="jellyfish" data-start-frame="2"></span></span>
    <span class="ocean-creature ocean-yellow-fish" data-swim="yellow-fish" data-side="right"><span class="ocean-sprite" data-sprite="yellow-fish"></span></span>
    <span class="ocean-creature ocean-deep-fish" data-swim="deep-fish" data-side="right"><span class="ocean-sprite" data-sprite="deep-fish"></span></span>
  </div>
  <div id="field-journal">
    <header class="fj-top">
      <a class="fj-brand" href="{{ '/' | relative_url }}">What a world,<br>huh?</a>
      <nav class="fj-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>The collection</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
        <a class="fj-submit" href="{{ site.submission_url | escape }}">Share your story</a>
      </nav>
    </header>
    <main id="main" tabindex="-1">{{ content }}</main>
    <footer class="fj-footer">
      <span>A shared field journal.</span>
      <a href="{{ site.submission_url | escape }}">There’s room for your story here.</a>
      <div class="fj-scene-controls" hidden>
        <label for="scene-select">Your surroundings</label>
        <select id="scene-select">
          <option value="forest">Forest floor</option>
          <option value="underwater">Underwater</option>
        </select>
        <button type="button" class="fj-motion-toggle" hidden>Pause movement</button>
      </div>
    </footer>
  </div>
  <div class="ocean-seafloor" aria-hidden="true">
    <div class="ocean-seafloor-art">
      <span class="ocean-sprite ocean-vent" data-sprite="vent"></span>
    </div>
    <span class="ocean-creature ocean-bottom-fish" data-swim="bottom-fish"><span class="ocean-sprite" data-sprite="bottom-fish"></span></span>
  </div>
</body>
</html>
