<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#fff8e9">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="field-journal">
    <header class="fj-top">
      <a class="fj-brand" href="{{ '/' | relative_url }}">What a world,<br>huh?</a>
      <nav class="fj-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>The collection</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
        <a class="fj-submit" href="{{ site.submission_url | escape }}">Share your story</a>
      </nav>
    </header>
    <main id="main" tabindex="-1">{{ content }}</main>
    <footer class="fj-footer">
      <span>A shared field journal.</span>
      <a href="{{ site.submission_url | escape }}">There’s room for your story here.</a>
    </footer>
  </div>
</body>
</html>
